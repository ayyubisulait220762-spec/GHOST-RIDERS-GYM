<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<meta name="description" content="Ghost Riders Gym: 6-day old-school training plan with animated exercises, voice coach and progress tracking.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ghost Riders">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Ghost Riders Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: night-gym app shell. Sticky header (logo, streak, sound, day strip), one screen at a time, bottom tab bar.
   Each exercise screen takes its muscle's plate color. Figure and muscle names sit side by side. */
:root{
  --bg:#0e1013; --panel:#171a1f; --panel2:#1e2228; --stage:#13161a; --ink:#eef1f4; --muted:#949daa; --line:#2a3038;
  --fig:#e9edf1; --prop:#3a414b; --plate:#7d8794; --accent:#f2c200; --good:#3fbf6f;
  --chest:#f0574b; --back:#5b93f0; --legs:#3fbf6f; --shoulders:#e6b52a; --triceps:#f08a3e; --biceps:#a47be6;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eceef1; --panel:#ffffff; --panel2:#f3f5f7; --stage:#f6f7f9; --ink:#14171b; --muted:#59616b; --line:#d6dae0;
  --fig:#1f242b; --prop:#bcc3cc; --plate:#3a414a; --accent:#d9a400; --good:#1f8a49;
  --chest:#d63a2f; --back:#2563c9; --legs:#22894a; --shoulders:#b98700; --triceps:#d0601a; --biceps:#7b4bc4; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eceef1; --panel:#ffffff; --panel2:#f3f5f7; --stage:#f6f7f9; --ink:#14171b; --muted:#59616b; --line:#d6dae0;
  --fig:#1f242b; --prop:#bcc3cc; --plate:#3a414a; --accent:#d9a400; --good:#1f8a49;
  --chest:#d63a2f; --back:#2563c9; --legs:#22894a; --shoulders:#b98700; --triceps:#d0601a; --biceps:#7b4bc4; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* header (compact so the exercise fits on one screen) */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:6px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px}
.logo{width:28px;height:28px;flex:none}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--display);font-weight:900;font-size:1.02rem;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.brand span{font-size:.62rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;white-space:nowrap}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.streak{font-family:var(--display);font-weight:800;font-size:.92rem;padding:3px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.icobtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;padding:0}
.icobtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:3px 0 2px;display:flex;flex-direction:column;align-items:center;position:relative;transition:transform .15s;line-height:1.05}
.chip:active{transform:scale(.94)}
.chip .d{font-family:var(--display);font-weight:900;font-size:1rem;line-height:1}
.chip .w{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip.today::after{content:"";position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.chip.done .d{color:var(--good)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .w,.chip[aria-pressed="true"].done .d{color:var(--bg)}

/* screens */
main{padding-block:8px calc(var(--dh,150px) + 8px)}
#screen{will-change:transform}
.in-r{animation:inR .26s cubic-bezier(.2,.8,.2,1)}
.in-l{animation:inL .26s cubic-bezier(.2,.8,.2,1)}
.in-f{animation:inF .22s ease-out}
@keyframes inR{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes inF{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.in-r,.in-l,.in-f{animation:none}}

/* workout screen: one column that exactly fills the space between header and dock; the figure takes what is left */
.wv{display:flex;flex-direction:column;gap:6px;
 height:max(470px,calc(100vh - var(--hh,84px) - var(--dh,90px) - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));
 height:max(470px,calc(100dvh - var(--hh,84px) - var(--dh,90px) - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)))}
.wv>*{flex:none}
.dayline{display:flex;align-items:center;gap:10px;min-height:34px}
.dl-t{min-width:0;flex:none}
.dayline h2{font-family:var(--display);font-weight:900;font-size:1.06rem;margin:0;text-transform:uppercase;line-height:1;white-space:nowrap}
.dayline small{display:block;color:var(--muted);font-size:.68rem;margin-top:2px;white-space:nowrap}
.ring{width:34px;height:34px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:.7rem}
.steps{display:flex;gap:4px;flex:1;min-width:0}
.step{flex:1;height:22px;border-radius:4px;background:none;border:0;padding:0;position:relative}
.step::before,.step i{content:"";position:absolute;left:0;right:0;top:8px;height:6px;border-radius:3px}
.step::before{background:var(--line)}
.step i{background:var(--c);transform:scaleX(var(--p,0));transform-origin:left;transition:transform .4s}
.step.cur::after{content:"";position:absolute;left:-2px;right:-2px;top:5px;height:12px;border-radius:5px;border:2px solid var(--ink)}

.hero{background:var(--stage);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;flex:1 1 0;min-height:130px;display:grid;grid-template-columns:minmax(0,1fr) clamp(104px,34%,150px)}
.hero.solo{grid-template-columns:1fr}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(110% 70% at 35% 100%,color-mix(in srgb,var(--c) 20%,transparent),transparent 70%);pointer-events:none}
.fig{position:relative;min-width:0;min-height:0}
.fig svg{position:absolute;inset:4px 0 0;width:100%;height:calc(100% - 4px);display:block}
.tags{position:absolute;top:7px;left:7px;display:flex;gap:4px;flex-wrap:wrap;z-index:2}
.tag{background:var(--c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);font-weight:700;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.int{font-weight:700;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:5px;border:1.5px solid var(--ink);background:var(--panel)}
.view{position:absolute;bottom:6px;left:8px;font-size:.64rem;color:var(--muted)}
.repov{position:absolute;top:4px;right:8px;text-align:right;pointer-events:none;z-index:3}
.repov b{display:block;font-family:var(--display);font-weight:900;font-size:3.8rem;line-height:.95;color:var(--c);text-shadow:0 2px 0 var(--stage)}
.repov small{display:block;font-weight:700;color:var(--muted);font-size:.74rem}
.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.mus{border-left:1px solid var(--line);padding:8px 9px;display:flex;flex-direction:column;justify-content:center;gap:7px;min-width:0;background:color-mix(in srgb,var(--panel) 55%,transparent);position:relative;overflow:hidden}
.mus h4{margin:0;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mu{display:flex;gap:6px;align-items:flex-start;min-width:0}
.mu i{width:8px;height:8px;border-radius:50%;flex:none;margin-top:4px;background:var(--muted);opacity:.6}
.mu.p i{background:var(--c);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.mu b{display:block;font-size:.8rem;line-height:1.12}
.mu.p b{color:var(--c)}
.mu em{display:block;font-size:.66rem;color:var(--muted);line-height:1.15;overflow-wrap:anywhere;font-style:normal}
.ctrl{display:flex;gap:6px;position:absolute;top:6px;right:6px;z-index:4}
.fig:has(.repov:not([hidden])) .ctrl{display:none}
.fig:has(.repov:not([hidden])) .int{display:none}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px;font-size:.72rem;font-weight:600}

.ename{font-family:var(--display);font-weight:900;font-size:1.42rem;line-height:1;margin:2px 0 0;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scheme{display:flex;flex-wrap:wrap;gap:4px}
.scheme span{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-size:.76rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.scheme span b{font-weight:700}
.act{display:flex;gap:6px;align-items:stretch}
.coach{flex:1;min-width:0;border:0;border-radius:12px;padding:10px 8px;font-weight:800;font-size:.95rem;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.02em;transition:transform .12s;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap}
.coach:active{transform:scale(.98)}
.coach.stop{background:var(--ink);color:var(--bg);text-shadow:none}
.sets{display:flex;gap:6px;flex:none}
.set{border:2px solid var(--c);background:var(--panel);border-radius:12px;padding:0 6px;min-width:58px;font-weight:700;font-size:.82rem;white-space:nowrap;transition:background .2s,transform .12s}
.set:active{transform:scale(.95)}
.set.on{background:var(--c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.timer{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:5px 8px 7px 12px;position:relative;overflow:hidden}
.timer .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--c);transition:width 1s linear}
.timer b{font-family:var(--display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.timer span{font-size:.8rem;color:var(--muted);font-weight:600}
.timer .tb{margin-left:auto;display:flex;gap:6px}
.timer button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:700;font-size:.82rem}
.howbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 11px 8px;font-size:.84rem;line-height:1.3}
ol.how{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
ol.how li::marker{font-weight:800;color:var(--c)}
.tip{font-style:italic;color:var(--ink);margin:5px 0 0;padding-top:5px;border-top:1px dashed var(--line)}
.tip::before{content:"Trainer: ";font-style:normal;font-weight:700;color:var(--c)}
.more{display:flex;gap:6px}
.more button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 4px;font-size:.78rem;font-weight:700;white-space:nowrap;color:var(--ink)}
.more button b{color:var(--c)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.box h3{font-family:var(--display);font-weight:800;font-size:1.05rem;text-transform:uppercase;margin:0 0 6px;letter-spacing:.02em}
.wv .box{margin-top:0}
.wrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wrow input{width:90px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 12px;font-weight:700}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.muted{color:var(--muted);font-size:.88rem}
.swaps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.swaps button{border:1.5px solid var(--c);background:var(--panel2);border-radius:99px;padding:6px 12px;font-size:.88rem;font-weight:600}
.learn{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.learn b{color:var(--c)}
/* bottom sheet for secondary info */
.scrim{position:fixed;inset:0;z-index:26;background:rgba(0,0,0,.45);animation:inF .2s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:27;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;max-height:75vh;overflow:auto;padding:6px 0 calc(16px + env(safe-area-inset-bottom,0px));animation:sheetUp .24s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 30px rgba(0,0,0,.3)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sheet .box{margin:0;border:0;padding:4px 0 0;background:none}
.sheet .shd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet .shd h3{margin:0}
.wlist2{display:flex;flex-direction:column;gap:3px;font-size:.78rem}
.wlist2 div{display:flex;justify-content:space-between;gap:6px;padding:4px 6px;border-radius:7px;line-height:1.15}
.wlist2 span{min-width:0;overflow-wrap:anywhere}.wlist2 b{flex:none}
.wlist2 div.on{background:color-mix(in srgb,var(--accent) 22%,transparent);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center}
.big{font-family:var(--display);font-weight:900;font-size:2.4rem;text-transform:uppercase;line-height:1;display:block;margin-bottom:8px}
.card p{margin:6px 0;color:var(--muted)}
.wlist{display:flex;flex-direction:column;gap:6px;margin-top:10px;text-align:left}
.wlist div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2)}
.wlist div.on{outline:2px solid var(--accent)}

/* bottom */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-block:5px}
.nav{border-radius:11px;padding:8px 0;font-weight:800;font-size:.95rem;background:var(--panel2);border:1px solid var(--line)}
.nav.next{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav:disabled{opacity:.3;cursor:default}
.count{font-family:var(--display);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.tabs button{border:0;background:none;padding:4px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem;font-weight:600;color:var(--muted)}
.tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent)}

/* week, progress, guide */
.sec{font-family:var(--display);font-weight:900;font-size:1.6rem;text-transform:uppercase;margin:4px 0 10px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.82rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--display);font-size:.95rem;text-transform:uppercase}
td.m{font-weight:700;color:var(--c);white-space:nowrap}
td button{border:0;background:none;padding:0;text-align:left;color:inherit}
td button small{display:inline-block;font-size:.66rem;font-weight:700;padding:0 5px;border-radius:4px;margin-left:4px;border:1px solid var(--muted);color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;font-size:.85rem}
.legend span b{font-family:var(--display)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:900;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center;font-size:.8rem;font-variant-numeric:tabular-nums}
.cal .h{color:var(--muted);font-size:.7rem;font-weight:700}
.cal .c{aspect-ratio:1;max-width:100%;border-radius:8px;display:grid;place-items:center;background:var(--panel2)}
.cal .c.tr{background:var(--good);color:#0e1013;font-weight:800}
.cal .c.fr{color:var(--muted)}
.cal .c.td{outline:2px solid var(--accent)}
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line)}
.chart .ln{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .ar{fill:color-mix(in srgb,var(--accent) 18%,transparent)}
.chart .pt{fill:var(--accent)}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.lifts{display:flex;flex-direction:column}
.lifts div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.lifts div:last-child{border-bottom:0}
.lifts b{font-variant-numeric:tabular-nums}
.gd p{margin:6px 0}
.gd ul{margin:6px 0;padding-left:18px}
.itbl{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;font-size:.85rem;margin-top:8px}
.itbl div{background:var(--panel2);padding:7px 8px}
.itbl .hd{font-weight:700;color:var(--muted);font-size:.75rem;text-transform:uppercase}
.wk{display:flex;gap:6px;margin-top:8px}
.wk button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 0;font-weight:800}
.wk button[aria-pressed="true"]{background:var(--accent);color:#14171b;border-color:var(--accent)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.sw{width:50px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.sw[aria-checked="true"]{background:color-mix(in srgb,var(--good) 30%,var(--panel2))}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--good)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.toast{position:fixed;left:50%;bottom:calc(var(--dh,140px) + 12px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:700;z-index:35;animation:inF .25s ease-out;white-space:nowrap}

/* figure */
.bd{fill:var(--fig)}

const CD=1.0,VLEAD=.28;
function startGuided(){
 ac();stopRest();closeSheet();const i=idx-1,{ex,int}=exAt(day,i),g=getSets(day,i),k=g.indexOf(0);
 if(k<0){toast("All sets done. Tap a set to redo it.");return}
 const target=topReps(repsOf(ex,int));
 guided={k,target,rep:0,said:0,phase:"count",segs:timing(ex,int),sched:[]};
 keepAwake(true);
 $("coach").textContent="■ Stop";$("coach").classList.add("stop");
 const ov=$("repov");ov.hidden=false;$("repof").textContent=`Set ${k+1} · ${target} reps`;$("repn").textContent="3";
 anim.playing=false;cancelAnimationFrame(anim.raf);anim.ex=ex;$("figsvg").innerHTML=figure(ex,0);
 say(`Set ${k+1}. ${target} reps.`,true);
 const lead=1.2,L=outLat(),t0=performance.now();
 if(ST8.snd&&ac())guided.sched=[SFX.beep(lead-L),SFX.beep(lead+CD-L),SFX.beep(lead+2*CD-L),SFX.go(lead+3*CD-L)];
 const pop=n=>{const r=$("repn");if(!r)return;r.textContent=n;r.classList.remove("pop");void r.offsetWidth;r.classList.add("pop")};
 const at=(sec,fn)=>{const d=t0+sec*1000-performance.now();return setTimeout(fn,Math.max(0,d))};
 let n=3;const cd=()=>{if(!guided)return;
  if(n>0){pop(n);n--;guided.to=at(lead+(3-n)*CD,cd)}
  else{pop(0);$("repof").textContent=`of ${target}`;say("Go",true);guided.phase="go";anim.segs=guided.segs;anim.t0=t0+(lead+3*CD)*1000;anim.speed=1;anim.playing=true;anim.el=0;
   guided.cEnd=conEnd(ex,guided.segs);guided.T=guided.segs.reduce((a,s)=>a+s[2],0);loop()}};
 guided.to=at(lead,cd);
}
function guidedTick(){
 if(!guided||guided.phase!=="go")return;
 const el=anim.el,repAt=n=>guided.cEnd+(n-1)*guided.T,L=outLat();
 /* voice a little early so it is heard as the rep completes */
 const nv=guided.said+1;if(nv<=guided.target&&el>=repAt(nv)-VLEAD){guided.said=nv;sayRep(nv)}
 const n=guided.rep+1;
 if(el>=repAt(n)-L-.02){guided.rep=n;const w=Math.max(0,repAt(n)-el-L);SFX.tick(w);
  setTimeout(()=>{const r=$("repn");if(r&&guided){r.textContent=n;r.classList.remove("pop");void r.offsetWidth;r.classList.add("pop")}},Math.max(0,(repAt(n)-el)*1000));
  if(n>=guided.target){guided.phase="end";guided.to=setTimeout(()=>endGuided(true),600)}}
}
function endGuided(finished){
 if(!guided)return;clearTimeout(guided.to);killTones(guided.sched);const k=guided.k;guided=null;
 const ov=$("repov");if(ov)ov.hidden=true;
 const c=$("coach");if(c){c.classList.remove("stop")}
 if(finished){toggleSet(k,1)}else{say("Stopped",true);const g=getSets(day,idx-1);if(c)c.textContent=coachLabel(g)}
 keepAwake(!!rest);
}

/* warm-up */
function warmView(sc){
 $("count").textContent="Warm-up";
 const tot=WARM.reduce((a,w)=>a+w.sec,0);
 sc.innerHTML=`<div class="wv" style="--c:var(--accent)">`+dayHead()+`
 <div class="hero"><div class="fig"><div class="tags"><span class="tag" style="color:#14171b;text-shadow:none">Warm-up</span><span class="int" id="wname">${WARM[0].n}</span></div>
  <svg id="figsvg" viewBox="0 0 220 210" role="img" aria-label="Warm-up animation"></svg>
  <div class="repov" id="repov" hidden><b id="repn"></b><small id="repof"></small></div></div>
  <div class="mus"><h4>${Math.round(tot/60)} min</h4><div class="wlist2" id="wlist">${WARM.map((w,k)=>`<div data-k="${k}" role="button" tabindex="0"><span>${w.n}</span><b>${w.sec}s</b></div>`).join("")}</div></div></div>
 <div class="ename">Warm up · ${Math.round(tot/60)} min</div>
 <p class="muted" style="margin:0;font-size:.82rem;line-height:1.3">Warm muscles lift more and don't get hurt. Follow the coach, then do 1 light set of your first exercise.</p>
 <div class="act"><button class="coach" id="wgo" style="color:#14171b;text-shadow:none">▶ Start warm-up with coach</button></div>
 <div class="howbox"><b>Then:</b> before your first heavy lift, do 1 set of 10 with an empty bar or a very light weight.</div>
 </div>`;
 bindSteps();
 const show=j=>{$("wname").textContent=WARM[j].n;document.querySelectorAll("#wlist div").forEach(d=>d.classList.toggle("on",+d.dataset.k===j));anim.ex=WARM[j].ex;anim.segs=null;anim.speed=1/WARM[j].spd;anim.t0=performance.now();anim.playing=true;loop()};
 show(0);
 document.querySelectorAll("#wlist div").forEach(d=>d.onclick=()=>{if(!warm){SFX.tap();show(+d.dataset.k)}});
 $("wgo").onclick=()=>{
  if(warm){clearInterval(warm.iv);killTones(warm.sched);warm=null;$("wgo").textContent="▶ Start warm-up with coach";$("repov").hidden=true;keepAwake(false);say("Stopped",true);return}
  ac();keepAwake(true);warm={j:0,end:performance.now()+WARM[0].sec*1000,left:WARM[0].sec,sched:null};show(0);$("wgo").textContent="■ Stop";$("repov").hidden=false;
  say(`Warm up. ${WARM[0].n}. ${WARM[0].sec} seconds.`);
  const upd=()=>{$("repn").textContent=warm.left;$("repof").textContent=WARM[warm.j].n};upd();
  warm.iv=setInterval(()=>{if(!warm)return;const ms=warm.end-performance.now(),left=Math.max(0,Math.ceil(ms/1000));
   if(!warm.sched&&ms<4300&&ms>3300&&ST8.snd&&ac()){const b=ms/1000-outLat();warm.sched=[SFX.beep(b-3),SFX.beep(b-2),SFX.beep(b-1),SFX.go(b)]}
   if(left===warm.left)return;warm.left=left;
   if(left<=3&&left>0&&!warm.sched)SFX.beep();
   if(left<=0){if(!warm.sched)SFX.go();warm.sched=null;warm.j++;
    if(warm.j>=WARM.length){clearInterval(warm.iv);warm=null;(ST8.sets[TODAY]??={})[`warm-${day}`]="1";save();say("Warm-up done. Let's lift.",true);toast("Warm-up done");dirn="r";idx=1;render();return}
    warm.left=WARM[warm.j].sec;warm.end=performance.now()+warm.left*1000;show(warm.j);say(`Next, ${WARM[warm.j].n}`,true)}
   upd()},100);
 };
}
function finishView(sc){
 const D=DAYS[day],pct=dayPct(day);
 $("count").textContent="Cardio";
 sc.innerHTML=`<div style="margin-bottom:10px">${dayHead()}</div><div class="card"><span class="big">${pct>=1?"Day complete":"Finisher"}</span>
 <p style="color:var(--ink);font-size:1.15rem;font-weight:700">${D.cardio[0]}</p><p>${D.cardio[1]}</p><p>This part burns the fat. Don't skip it.</p>
 ${pct<1?`<p><b>${Math.round(pct*100)}%</b> of today's sets ticked. Go back and tick the rest.</p>`:""}</div>
 <div class="box"><h3>After training</h3><p class="muted" style="margin:0">Eat a meal with protein within 2 hours: eggs, chicken, dal with rice, paneer, curd or a protein shake.</p></div>`;
 bindSteps();
}

/* ===== week ===== */
function weekView(sc){
 const ORDER=["legs","chest","back","shoulders","triceps","biceps"];
 const cell=(d,m)=>{const i=DAYS[d].sl.findIndex((_,k)=>exAt(d,k).ex.m===m),{ex,int}=exAt(d,i);return `<td><button data-d="${d}" data-i="${i}">${esc(ex.n)}<small>${int}</small></button></td>`};
 sc.innerHTML=`<h2 class="sec">This week</h2>
 <div class="legend"><span><b>H</b> Heavy 6–8</span><span><b>M</b> Medium 8–12</span><span><b>P</b> Pump 12–15</span></div>
 <div class="tbl"><table><tr><th></th>${DAYS.slice(0,6).map((d,i)=>`<th>D${i+1} ${d.wk}</th>`).join("")}</tr>
 ${ORDER.map(m=>`<tr><td class="m" style="--c:var(${G[m][1]})">${G[m][0]}</td>${DAYS.slice(0,6).map((_,d)=>cell(d,m)).join("")}</tr>`).join("")}
 <tr><td class="m" style="--c:var(--accent)">Cardio</td>${DAYS.slice(0,6).map(d=>`<td>${d.cardio[0]}</td>`).join("")}</tr></table></div>
 <p class="muted">Friday is rest. Tap any exercise to open it. Every muscle gets 2 heavy, 2 medium and 2 pump days each week.</p>`;
 sc.querySelectorAll("td button").forEach(b=>b.onclick=()=>{day=+b.dataset.d;idx=+b.dataset.i+1;tab="work";dirn="r";render();scrollTo(0,0)});
}

/* ===== progress ===== */
function progView(sc){
 const s=streak(),now=new Date(),y=now.getFullYear(),mo=now.getMonth();
 const first=new Date(y,mo,1),dim=new Date(y,mo+1,0).getDate(),off=(first.getDay()+1)%7;
 let trainedCount=0;const cells=[];
 for(let k=0;k<off;k++)cells.push('<div></div>');
 for(let d=1;d<=dim;d++){const dt=new Date(y,mo,d),key=dk(dt),t=trained(key);if(t)trainedCount++;cells.push(`<div class="c${t?" tr":""}${dt.getDay()===5?" fr":""}${key===TODAY?" td":""}">${d}</div>`)}
 const bw=ST8.bw.slice(-14);
 const lifts=Object.entries(ST8.w).filter(([k,v])=>LIB[k]&&v.length).map(([k,v])=>`<div><span>${esc(LIB[k].n)}</span><b>${v[v.length-1].kg} kg${v.length>1?` <span class="muted">(best ${Math.max(...v.map(x=>x.kg))})</span>`:""}</b></div>`).join("");
 sc.innerHTML=`<h2 class="sec">Progress</h2>
 <div class="stats"><div class="stat"><b>${s}</b><span>day streak</span></div><div class="stat"><b>${ST8.best}</b><span>best streak</span></div><div class="stat"><b>${trainedCount}</b><span>days this month</span></div></div>
 <div class="box"><h3>${now.toLocaleString("en",{month:"long"})} ${y}</h3>
  <div class="cal">${["Sat","Sun","Mon","Tue","Wed","Thu","Fri"].map(d=>`<div class="h">${d}</div>`).join("")}${cells.join("")}</div>
  <p class="muted" style="margin:8px 0 0">Green days are days you trained. Fridays don't break your streak.</p></div>
 <div class="box"><h3>Body weight</h3>
  <div class="wrow"><input id="bwIn" type="number" inputmode="decimal" step="0.1" placeholder="kg" aria-label="Body weight in kg"><button class="btn pri" id="bwSave">Add</button><span class="muted">Weigh once a week, morning, before food.</span></div>
  <div class="chart" id="bwChart" style="margin-top:10px">${bwChart(bw)}</div></div>
 <div class="box"><h3>Your lifts</h3>${lifts?`<div class="lifts">${lifts}</div>`:`<p class="muted" style="margin:0">Save your weight on any exercise and it shows up here.</p>`}</div>`;
 $("bwSave").onclick=()=>{const v=parseFloat($("bwIn").value);if(!(v>20&&v<300))return toast("Enter your weight in kg");const L=ST8.bw;if(L.length&&L[L.length-1].d===TODAY)L[L.length-1].kg=v;else L.push({d:TODAY,kg:v});save();SFX.set();progView(sc)};
}
function bwChart(d){
 if(d.length<2)return `<p class="muted" style="margin:0">${d.length?`First entry: <b>${d[0].kg} kg</b>. Add one more next week to see your line.`:"Add your weight to start the chart."}</p>`;
 const W=320,H=150,pl=34,pr=10,pt=12,pb=24,v=d.map(x=>x.kg);let mn=Math.min(...v),mx=Math.max(...v);if(mx-mn<2){mn-=1;mx+=1}
 const X2=i=>pl+i*(W-pl-pr)/(d.length-1),Y=k=>pt+(mx-k)*(H-pt-pb)/(mx-mn);
 const pts=d.map((x,i)=>`${X2(i).toFixed(1)},${Y(x.kg).toFixed(1)}`).join(" ");
 const ticks=[mx,(mx+mn)/2,mn];
 const ch=v[v.length-1]-v[0];
 return `<svg viewBox="0 0 ${W} ${H}">${ticks.map(t=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl-6}" y="${Y(t)+3}" text-anchor="end">${t.toFixed(1)}</text>`).join("")}
 <polygon class="ar" points="${X2(0)},${H-pb} ${pts} ${X2(d.length-1)},${H-pb}"/><polyline class="ln" points="${pts}"/>
 ${d.map((x,i)=>`<circle class="pt" cx="${X2(i)}" cy="${Y(x.kg)}" r="${i===d.length-1?4.5:2.5}"/>`).join("")}
 <text x="${pl}" y="${H-6}">${d[0].d.slice(5).split("-").reverse().join("/")}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${d[d.length-1].d.slice(5).split("-").reverse().join("/")}</text></svg>
 <p class="muted" style="margin:4px 0 0">${ch<0?`Down <b>${Math.abs(ch).toFixed(1)} kg</b>. Keep going.`:ch>0?`Up <b>${ch.toFixed(1)} kg</b>. Check your food portions.`:"No change yet."}</p>`;
}

/* ===== guide ===== */
function guideView(sc){
 const wn=weekNo();
 sc.innerHTML=`<h2 class="sec">Trainer's guide</h2>
 <div class="box gd"><h3>How this plan works</h3>
 <p>You train every muscle every day with one exercise, 6 days a week. Hitting a muscle often builds it fast, but only if each day is not too hard. So each muscle rotates through three kinds of days:</p>
 <div class="itbl"><div class="hd"></div><div class="hd">Reps</div><div class="hd">Rest</div><div class="hd">Feel</div>
 <div><b>Heavy</b></div><div>6–8</div><div>2 min</div><div>2 reps left</div>
 <div><b>Medium</b></div><div>8–12</div><div>90 sec</div><div>1–2 left</div>
 <div><b>Pump</b></div><div>12–15</div><div>60 sec</div><div>Burn</div></div>
 <p>Every muscle gets 2 of each kind per week, and every day has 2 heavy, 2 medium and 2 pump exercises. Heavy ones come first while you are fresh.</p></div>
 <div class="box gd"><h3>Lift the right way</h3><ul>
 <li><b>Tempo:</b> lift in 1 second, squeeze, lower in 2 seconds. The coach button counts this for you.</li>
 <li><b>Form first:</b> if your form breaks, the weight is too heavy.</li>
 <li><b>Add weight slowly:</b> when you hit the top number of reps on all sets, add 2.5 kg next time. This is called double progression.</li></ul></div>
 <div class="box gd"><h3>4-week cycle</h3>
 <p>Weeks 1–3 you push. Week 4 is an easy week: 2 sets per exercise and about 10% lighter, so your body recovers and comes back stronger.</p>
 <p class="muted" style="margin-bottom:0">Which week are you in?</p>
 <div class="wk">${[1,2,3,4].map(n=>`<button aria-pressed="${n===wn}" data-w="${n}">${n}</button>`).join("")}</div></div>
 <div class="box gd"><h3>Fat loss with muscle</h3><ul>
 <li><b>Protein:</b> about 2 g per kg of body weight every day. For 75 kg, that's 150 g.</li>
 <li><b>Calories:</b> eat a little less than you burn. Cut sugar, fried snacks and cold drinks first.</li>
 <li><b>Steps:</b> 8,000–10,000 a day outside the gym.</li>
 <li><b>Water:</b> 3 litres. <b>Sleep:</b> 7–8 hours.</li>
 <li><b>Goal:</b> lose about 0.5 kg a week. Faster than that and you lose muscle too.</li></ul></div>
 <div class="box gd"><h3>Stay safe</h3><ul>
 <li>Use a spotter on heavy bench press.</li>
 <li>Sharp pain in a joint means stop. Muscle burn is fine, joint pain is not.</li>
 <li>Squat, deadlift and rows: keep your back straight every rep.</li></ul></div>
 <div class="box"><h3>Settings</h3>
 <div class="set-row"><span>Sound effects</span><button class="sw" role="switch" id="swS" aria-checked="${!!ST8.snd}" aria-label="Sound effects"></button></div>
 <div class="set-row"><span>Voice coach</span><button class="sw" role="switch" id="swV" aria-checked="${!!ST8.voice}" aria-label="Voice coach"></button></div>
 <div class="set-row"><span>Test the sound</span><button class="btn" id="testS">Play</button></div></div>`;
 sc.querySelectorAll(".wk button").forEach(b=>b.onclick=()=>{const n=+b.dataset.w,d=new Date();d.setDate(d.getDate()-(n-1)*7);ST8.start=dk(d);save();SFX.tap();render()});
 $("swS").onclick=()=>{ST8.snd=ST8.snd?0:1;save();$("swS").setAttribute("aria-checked",!!ST8.snd);sndIcon();if(ST8.snd){ac();SFX.set()}};
 $("swV").onclick=()=>{ST8.voice=ST8.voice?0:1;save();$("swV").setAttribute("aria-checked",!!ST8.voice);if(ST8.voice)say("Voice coach on")};
 $("testS").onclick=()=>{ac();SFX.set();say("Welcome to Ghost Riders Gym. Let's train.")};
}

/* ===== effects ===== */
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function celebrate(){
 stopRest();SFX.win();say("Workout complete. Great job. Now finish with cardio.");
 if(navigator.vibrate)try{navigator.vibrate([60,40,60,40,120])}catch(e){}
 if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
 const cv=$("fx"),x=cv.getContext("2d"),W=cv.width=innerWidth,H=cv.height=innerHeight,cs=getComputedStyle(document.documentElement);
 const cols=["--chest","--back","--legs","--shoulders","--triceps","--biceps","--accent"].map(v=>cs.getPropertyValue(v).trim());
 const ps=Array.from({length:150},()=>({x:W/2,y:H*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
 const t0=performance.now();const fr=n=>{const t=(n-t0)/1000;x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=Math.max(0,1-t/2.6);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(t<2.7)requestAnimationFrame(fr);else x.clearRect(0,0,W,H)};requestAnimationFrame(fr)}
 toast("Day complete! 🔥");
 setTimeout(()=>{dirn="r";idx=DAYS[day].sl.length+1;render()},1600);
}

/* ===== wiring ===== */
$("prev").onclick=()=>{if(idx>0){SFX.tap();dirn="l";idx--;render();scrollTo({top:0,behavior:"smooth"})}};
$("next").onclick=()=>{SFX.tap();dirn="r";idx++;render();scrollTo({top:0,behavior:"smooth"})};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{SFX.tap();tab=b.dataset.t;render();scrollTo(0,0)});
$("sndBtn").onclick=()=>{ST8.snd=ST8.snd?0:1;save();sndIcon();if(ST8.snd){ac();SFX.set()}else try{speechSynthesis.cancel()}catch(e){}};
let tx=0,ty=0;
$("screen").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$("screen").addEventListener("touchend",e=>{if(tab!=="work"||guided||warm)return;if(e.target.closest("input,.tbl"))return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&!$("next").disabled)$("next").click();else if(dx>0&&!$("prev").disabled)$("prev").click()}},{passive:true});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&(rest||guided||warm))keepAwake(true)});
const measure=()=>{const r=document.documentElement.style;r.setProperty("--hh",document.querySelector("header").offsetHeight+"px");r.setProperty("--dh",document.querySelector(".dock").offsetHeight+"px")};
if(window.ResizeObserver){const ro=new ResizeObserver(measure);ro.observe(document.querySelector("header"));ro.observe(document.querySelector(".dock"))}
addEventListener("resize",()=>{measure();fitName()});
render();measure();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
